aid: hycu
name: HYCU
description: >-
  HYCU is an AI-powered data resilience and data protection platform that backs
  up, protects, and recovers more than 100 workloads across on-premises, public
  cloud, and SaaS environments. Its R-Cloud platform is delivered as a low-code
  data protection development platform that lets SaaS and AI application
  providers rapidly build and publish backup-and-recovery services to the
  R-Cloud Marketplace, alongside R-Shield for ransomware threat prevention and
  recoverability validation and aiR for querying backup data as an intelligence
  source. HYCU serves 4,800+ organizations across 78 countries and is recognized
  as a Leader by IDC and Gartner. This profile was surfaced as a portfolio
  company of Bain Capital Ventures and enriched by the API Evangelist pipeline;
  HYCU exposes a low-code developer platform rather than a public REST API.
